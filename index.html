<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dennis Tier - Bảng Xếp Hạng PvP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#07090e] text-gray-100 min-h-screen selection:bg-pink-500 selection:text-gray-950">
    
    <!-- Hiệu ứng ánh sáng nền -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[900px] h-[350px] bg-pink-500/10 blur-[140px] pointer-events-none rounded-full"></div>

    <!-- Navbar -->
    <nav class="max-w-7xl mx-auto px-8 py-6 flex items-center justify-between border-b border-gray-800/50 relative z-10">
        <div class="flex items-center gap-12">
            <div class="flex items-center gap-4 group cursor-pointer">
                <div class="w-11 h-11 bg-gradient-to-br from-pink-400 via-pink-500 to-rose-600 rounded-2xl flex items-center justify-center font-black text-gray-950 shadow-lg shadow-pink-500/25">D</div>
                <div>
                    <span class="font-extrabold text-base tracking-wider bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">DENNIS TIER</span>
                    <span class="block text-[11px] tracking-widest text-pink-400 font-bold uppercase mt-0.5">PvP Leaderboard</span>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-gray-400">
                <a href="#" class="hover:text-pink-400 transition-colors">Trang chủ</a>
                <a href="#" class="text-pink-400 font-bold bg-pink-500/10 px-4 py-2 rounded-xl border border-pink-500/20">Bảng Xếp Hạng</a>
                <a href="https://discord.gg/linkcuaban" target="_blank" class="hover:text-pink-400 transition-colors">Discord</a>
            </div>
        </div>

        <div class="flex items-center gap-5">
            <div class="relative hidden sm:block">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" id="search-input" placeholder="Tìm kiếm người chơi..." class="bg-gray-900/90 border border-gray-800 rounded-2xl pl-11 pr-5 py-2.5 text-xs text-gray-200 focus:outline-none focus:border-pink-500/60 focus:ring-2 focus:ring-pink-500/20 w-64 transition-all duration-300">
            </div>
        </div>
    </nav>

    <!-- Nội dung chính -->
    <main class="max-w-7xl mx-auto px-8 py-10 relative z-10">
        
        <!-- Header tiêu đề -->
        <div class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <div class="flex items-center gap-2.5 text-pink-400 font-bold text-xs tracking-widest uppercase mb-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-pink-500 animate-ping"></span>
                    Hệ thống xếp hạng mùa giải
                </div>
                <h1 class="text-3xl lg:text-4xl font-extrabold text-white tracking-tight leading-snug">Bảng Xếp Hạng PvP</h1>
                <p class="text-gray-400 text-sm mt-2 leading-relaxed">Khám phá thứ hạng và điểm số của các chiến binh hàng đầu trong từng chế độ.</p>
            </div>
            <div class="flex items-center gap-3 bg-gray-900/60 border border-gray-800/80 px-5 py-3 rounded-2xl text-xs font-semibold text-gray-400">
                <span>Trạng thái:</span>
                <span class="text-emerald-400 flex items-center gap-1.5 font-bold">🟢 Đang hoạt động</span>
            </div>
        </div>

        <!-- Các nút lọc Chế độ chơi -->
        <div class="flex items-center gap-3 overflow-x-auto pb-4 mb-10 scrollbar-thin">
            <button onclick="filterMode('all')" data-mode="all" class="mode-btn flex flex-col items-center justify-center gap-1.5 px-4 py-3 rounded-2xl text-[11px] font-bold bg-gradient-to-r from-pink-400 to-rose-500 text-gray-950 shadow-lg shadow-pink-500/20 whitespace-nowrap transition-all duration-300 min-w-[85px]">
                <img src="https://api.iconify.design/twemoji:trophy.svg" class="w-5 h-5 object-contain" alt="Overall"> OVERALL
            </button>
            <button onclick="filterMode('Sword')" data-mode="Sword" class="mode-btn flex flex-col items-center justify-center gap-1.5 px-4 py-3 rounded-2xl text-[11px] font-semibold bg-gray-900/80 text-gray-400 hover:text-pink-300 hover:bg-gray-800 border border-gray-800/80 hover:border-pink-500/30 whitespace-nowrap transition-all duration-300 min-w-[85px]">
                <img src="https://cdn.discordapp.com/emojis/1549311745951010867.webp?size=32&quality=lossless" class="w-5 h-5 object-contain" alt="Sword"> SWORD
            </button>
            <button onclick="filterMode('Nethop')" data-mode="Nethop" class="mode-btn flex flex-col items-center justify-center gap-1.5 px-4 py-3 rounded-2xl text-[11px] font-semibold bg-gray-900/80 text-gray-400 hover:text-pink-300 hover:bg-gray-800 border border-gray-800/80 hover:border-pink-500/30 whitespace-nowrap transition-all duration-300 min-w-[85px]">
                <img src="https://cdn.discordapp.com/emojis/1549311747725336598.webp?size=32&quality=lossless" class="w-5 h-5 object-contain" alt="Nethop"> NETHOP
            </button>
            <button onclick="filterMode('SMP')" data-mode="SMP" class="mode-btn flex flex-col items-center justify-center gap-1.5 px-4 py-3 rounded-2xl text-[11px] font-semibold bg-gray-900/80 text-gray-400 hover:text-pink-300 hover:bg-gray-800 border border-gray-800/80 hover:border-pink-500/30 whitespace-nowrap transition-all duration-300 min-w-[85px]">
                <img src="https://cdn.discordapp.com/emojis/1549311750254493696.webp?size=32&quality=lossless" class="w-5 h-5 object-contain" alt="SMP"> SMP
            </button>
            <button onclick="filterMode('Uhc')" data-mode="Uhc" class="mode-btn flex flex-col items-center justify-center gap-1.5 px-4 py-3 rounded-2xl text-[11px] font-semibold bg-gray-900/80 text-gray-400 hover:text-pink-300 hover:bg-gray-800 border border-gray-800/80 hover:border-pink-500/30 whitespace-nowrap transition-all duration-300 min-w-[85px]">
                <img src="https://cdn.discordapp.com/emojis/1549311742000103443.webp?size=32&quality=lossless" class="w-5 h-5 object-contain" alt="Uhc"> UHC
            </button>
            <button onclick="filterMode('Axe')" data-mode="Axe" class="mode-btn flex flex-col items-center justify-center gap-1.5 px-4 py-3 rounded-2xl text-[11px] font-semibold bg-gray-900/80 text-gray-400 hover:text-pink-300 hover:bg-gray-800 border border-gray-800/80 hover:border-pink-500/30 whitespace-nowrap transition-all duration-300 min-w-[85px]">
                <img src="https://cdn.discordapp.com/emojis/1549311752771084348.webp?size=32&quality=lossless" class="w-5 h-5 object-contain" alt="Axe"> AXE
            </button>
            <button onclick="filterMode('Vanilla')" data-mode="Vanilla" class="mode-btn flex flex-col items-center justify-center gap-1.5 px-4 py-3 rounded-2xl text-[11px] font-semibold bg-gray-900/80 text-gray-400 hover:text-pink-300 hover:bg-gray-800 border border-gray-800/80 hover:border-pink-500/30 whitespace-nowrap transition-all duration-300 min-w-[85px]">
                <img src="https://cdn.discordapp.com/emojis/1549311743975497759.webp?size=32&quality=lossless" class="w-5 h-5 object-contain" alt="Vanilla"> VANILLA
            </button>
            <button onclick="filterMode('Mace')" data-mode="Mace" class="mode-btn flex flex-col items-center justify-center gap-1.5 px-4 py-3 rounded-2xl text-[11px] font-semibold bg-gray-900/80 text-gray-400 hover:text-pink-300 hover:bg-gray-800 border border-gray-800/80 hover:border-pink-500/30 whitespace-nowrap transition-all duration-300 min-w-[85px]">
                <img src="https://cdn.discordapp.com/emojis/1549311739462422558.webp?size=32&quality=lossless" class="w-5 h-5 object-contain" alt="Mace"> MACE
            </button>
        </div>

        <!-- Khung bảng xếp hạng -->
        <div class="bg-gray-900/40 border border-gray-800/60 rounded-3xl overflow-hidden shadow-2xl backdrop-blur-xl">
            <!-- Tiêu đề cột (Đã có lại cột # ở đầu) -->
            <div class="grid grid-cols-12 bg-gray-950/70 px-8 py-5 text-xs font-bold text-gray-400 uppercase tracking-wider border-b border-gray-800/60">
                <div class="col-span-1">#</div>
                <div class="col-span-5">Người chơi</div>
                <div class="col-span-2 text-center">Điểm số</div>
                <div class="col-span-4 text-right pr-4">Cấp độ Tier</div>
            </div>

            <!-- Dữ liệu render bằng JavaScript -->
            <div id="leaderboard-body" class="divide-y divide-gray-800/30">
                <!-- Nội dung được nạp động -->
            </div>
        </div>

    </main>

    <!-- Script xử lý hiển thị -->
    <script src="/main.js"></script>
</body>
</html>
