<!-- Appwrite Web SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

    <script>
        // CẤU HÌNH APPWRITE
        const { Client, Databases, Query } = Appwrite;
        
        const client = new Client()
            .setEndpoint('https://cloud.appwrite.io/v1') // Hoặc endpoint Appwrite của bạn
            .setProject('YOUR_PROJECT_ID');            // ⚠️️ Thay bằng Project ID của bạn

        const databases = new Databases(client);
        
        // ⚠️ Thay bằng Database ID và Collection ID của bạn trên Appwrite
        const DATABASE_ID = 'YOUR_DATABASE_ID';
        const COLLECTION_ID = 'players'; 

        const TIER_POINTS = {
            'HT1': 60, 'LT1': 45, 'HT2': 30, 'LT2': 20, 'HT3': 10,
            'LT3': 6, 'HT4': 4, 'LT4': 3, 'HT5': 2, 'LT5': 1
        };

        function calculatePlayerPoints(tiersObj) {
            if (!tiersObj) return 0;
            let total = 0;
            // Nếu tiersObj lưu dưới dạng JSON string từ Appwrite, cần parse ra object
            let tiers = typeof tiersObj === 'string' ? JSON.parse(tiersObj) : tiersObj;
            for (const modeId in tiers) {
                const tierVal = tiers[modeId];
                if (tierVal && TIER_POINTS[tierVal]) total += TIER_POINTS[tierVal];
            }
            return total;
        }

        const defaultModes = [
            { id: 'overall', name: 'OVERALL', icon: 'https://api.iconify.design/twemoji:trophy.svg' },
            { id: 'Sword', name: 'SWORD', icon: 'https://cdn.discordapp.com/emojis/1549311745951010867.webp?size=48&quality=lossless' },
            { id: 'NetheritePot', name: 'NETHOP', icon: 'https://cdn.discordapp.com/emojis/1549311747725336598.webp?size=48&quality=lossless' },
            { id: 'SMP', name: 'SMP', icon: 'https://cdn.discordapp.com/emojis/1549311750254493696.webp?size=48&quality=lossless' },
            { id: 'UHC', name: 'UHC', icon: 'https://cdn.discordapp.com/emojis/1549311742000103443.webp?size=48&quality=lossless' },
            { id: 'Axe', name: 'AXE', icon: 'https://cdn.discordapp.com/emojis/1549311752771084348.webp?size=48&quality=lossless' },
            { id: 'Vanilla', name: 'VANILLA', icon: 'https://cdn.discordapp.com/emojis/1549311743975497759.webp?size=48&quality=lossless' },
            { id: 'Mace', name: 'MACE', icon: 'https://cdn.discordapp.com/emojis/1549311739462422558.webp?size=48&quality=lossless' }
        ];

        let players = [];
        let modes = defaultModes;
        let activeTab = 'overall';
        let searchQuery = '';
        let currentView = 'leaderboard';
        const TIER_RANKS = ['HT1', 'HT2', 'HT3', 'HT4', 'HT5', 'LT1', 'LT2', 'LT3', 'LT4', 'LT5'];

        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            fetchTiersFromAppwrite();
            setupSearchListener();
            setTimeout(updateIndicatorPosition, 50);
        });

        window.addEventListener('resize', () => updateIndicatorPosition());

        // HÀM LẤY DỮ LIỆU TỪ APPWRITE
        async function fetchTiersFromAppwrite() {
            try {
                const response = await databases.listDocuments(
                    DATABASE_ID,
                    COLLECTION_ID,
                    [Query.limit(100)] // Lấy tối đa 100 người chơi, có thể chỉnh lại
                );

                if (response && response.documents) {
                    players = response.documents.map(doc => {
                        let parsedTiers = doc.tiers;
                        if (typeof parsedTiers === 'string') {
                            try { parsedTiers = JSON.parse(parsedTiers); } catch(e) { parsedTiers = {}; }
                        }
                        return {
                            id: doc.$id,
                            username: doc.username,
                            tiers: parsedTiers || {},
                            points: calculatePlayerPoints(parsedTiers)
                        };
                    });

                    players.sort((a, b) => b.points - a.points);
                    renderLeaderboard();
                }
            } catch (err) {
                console.error('Lỗi kết nối Appwrite:', err);
            }
        }

        function loginWithDiscord(e) {
            e.preventDefault();
            alert("Tính năng Đăng nhập với Discord đang được kết nối!");
        }

        function switchMainView(view) {
            currentView = view;
            const lbView = document.getElementById('leaderboardView');
            const tlView = document.getElementById('tierlistView');
            const btnLb = document.getElementById('navBtnLeaderboard');
            const title = document.getElementById('viewTitle');
            const subtitle = document.getElementById('viewSubtitle');

            if (view === 'leaderboard') {
                lbView.classList.remove('hidden');
                tlView.classList.add('hidden');
                btnLb.className = "text-pink-400 font-extrabold flex items-center gap-2 border-b-2 border-pink-400 pb-1 transition-all duration-300";
                title.innerText = "Bảng Xếp Hạng";
                subtitle.innerText = "Khám phá thứ hạng và điểm số của các chiến binh hàng đầu trong từng chế độ.";
                renderLeaderboard();
            } else {
                lbView.classList.add('hidden');
                tlView.classList.remove('hidden');
                btnLb.className = "text-slate-400 hover:text-pink-400 transition-colors flex items-center gap-2 pb-1";
                title.innerText = "Tier List Maker";
                subtitle.innerText = `Kéo thả xếp hạng người chơi cho Chế độ: ${activeTab.toUpperCase()}`;
                renderTierlistMaker();
            }
        }

        function renderTabs() {
            const wrapper = document.getElementById('modeTabsWrapper');
            const indicator = document.getElementById('activeIndicator');
            wrapper.innerHTML = '';
            wrapper.appendChild(indicator);

            modes.forEach((mode, index) => {
                const isActive = activeTab === mode.id;
                const activeClass = isActive ? 'active' : '';

                const btn = document.createElement('button');
                btn.id = `tab_btn_${mode.id}`;
                btn.onclick = () => switchTab(mode.id);
                
                let radiusClass = 'rounded-t-xl';
                if (index === 0) radiusClass = 'rounded-tl-xl rounded-tr-xl';
                else if (index === modes.length - 1) radiusClass = 'rounded-tr-xl rounded-tl-xl';

                btn.className = `mode-btn flex-1 flex flex-col items-center justify-center gap-1 px-3 py-2.5 ${radiusClass} group ${activeClass}`;
                
                btn.innerHTML = `
                    <div class="w-6 h-6 flex items-center justify-center">
                        <img src="${mode.icon}" class="w-6 h-6 object-contain drop-shadow-sm transition-transform duration-300" alt="${mode.name}">
                    </div>
                    <span class="text-[11px] tracking-wider font-extrabold text-slate-300 group-hover:text-pink-400 transition-colors inline-block">${mode.name}</span>
                `;
                wrapper.appendChild(btn);
            });
            updateIndicatorPosition();
        }

        function updateIndicatorPosition() {
            const activeBtn = document.getElementById(`tab_btn_${activeTab}`);
            const indicator = document.getElementById('activeIndicator');
            const wrapper = document.getElementById('modeTabsWrapper');

            if (activeBtn && indicator && wrapper) {
                const btnRect = activeBtn.getBoundingClientRect();
                const wrapperRect = wrapper.getBoundingClientRect();
                const leftPos = btnRect.left - wrapperRect.left + wrapper.scrollLeft;
                const width = btnRect.width;

                indicator.style.width = `${width}px`;
                indicator.style.transform = `translateX(${leftPos}px)`;
            }
        }

        function switchTab(modeId) {
            if (activeTab === modeId) return;
            activeTab = modeId;
            
            modes.forEach(m => {
                const b = document.getElementById(`tab_btn_${m.id}`);
                if (b) {
                    if (m.id === modeId) b.classList.add('active');
                    else b.classList.remove('active');
                }
            });

            updateIndicatorPosition();

            if (currentView === 'leaderboard') {
                renderLeaderboard();
            } else {
                document.getElementById('viewSubtitle').innerText = `Kéo thả xếp hạng người chơi cho Chế độ: ${activeTab.toUpperCase()}`;
                renderTierlistMaker();
            }
        }

        function getTierClass(tierVal) {
            if (!tierVal) return { circle: 'tier-circle-tier2', label: 'tier-label-tier2' };
            const cleanVal = tierVal.toUpperCase();
            if (cleanVal.endsWith('1')) return { circle: 'tier-circle-tier1', label: 'tier-label-tier1' };
            if (cleanVal.endsWith('2')) return { circle: 'tier-circle-tier2', label: 'tier-label-tier2' };
            if (cleanVal.endsWith('3')) return { circle: 'tier-circle-tier3', label: 'tier-label-tier3' };
            if (cleanVal.endsWith('4')) return { circle: 'tier-circle-tier4', label: 'tier-label-tier4' };
            if (cleanVal.endsWith('5')) return { circle: 'tier-circle-tier5', label: 'tier-label-tier5' };
            return { circle: 'tier-circle-tier2', label: 'tier-label-tier2' };
        }

        function renderLeaderboard() {
            const overallContent = document.getElementById('overallLeaderboardContent');
            const modeColumnsContent = document.getElementById('modeTierColumnsContent');
            const emptyState = document.getElementById('emptyState');

            let filtered = players.filter(p => p.username.toLowerCase().includes(searchQuery.toLowerCase()));

            if (activeTab === 'overall') {
                overallContent.classList.remove('hidden');
                modeColumnsContent.classList.add('hidden');

                filtered.sort((a, b) => b.points - a.points);
                const container = document.getElementById('leaderboardBody');

                if (filtered.length === 0) {
                    container.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                } else {
                    emptyState.classList.add('hidden');
                }

                container.innerHTML = filtered.map((player, idx) => {
                    const rank = idx + 1;
                    let rankDisplay = `<span class="text-slate-400 font-black text-xl">${rank}</span>`;
                    if (rank === 1) rankDisplay = `<span class="text-pink-400 font-black text-2xl">1</span>`;
                    if (rank === 2) rankDisplay = `<span class="text-rose-400 font-black text-2xl">2</span>`;
                    if (rank === 3) rankDisplay = `<span class="text-amber-400 font-black text-2xl">3</span>`;

                    const skinUrl = `https://vzge.me/bust/220/${player.username}`;

                    const badgesHtml = modes.filter(m => m.id !== 'overall').map(mode => {
                        const tierVal = player.tiers ? player.tiers[mode.id] : null;
                        if (!tierVal) {
                            return `
                                <div class="flex flex-col items-center gap-1.5 flex-shrink-0 min-w-[48px] opacity-40">
                                    <div class="w-10 h-10 rounded-full tier-circle-empty flex items-center justify-center">
                                        <img src="${mode.icon}" class="w-5 h-5 object-contain opacity-50" alt="${mode.name}">
                                    </div>
                                    <span class="tier-label-empty text-xs font-black px-2 py-0.5 rounded leading-none">-</span>
                                </div>
                            `;
                        }
                        const tClass = getTierClass(tierVal);
                        return `
                            <div class="flex flex-col items-center gap-1.5 flex-shrink-0 min-w-[48px] group relative">
                                <div class="w-10 h-10 rounded-full ${tClass.circle} flex items-center justify-center shadow-sm">
                                    <img src="${mode.icon}" class="w-5 h-5 object-contain" alt="${mode.name}">
                                </div>
                                <span class="${tClass.label} text-xs font-black px-2 py-0.5 rounded leading-none tracking-tight shadow-sm">${tierVal}</span>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="player-row flex items-center px-4 py-3.5" onclick="openPlayerModal('${player.username}')">
                            <div class="w-12 text-center flex-shrink-0">${rankDisplay}</div>
                            <div class="w-[38%] sm:w-[32%] flex-shrink-0">
                                <div class="flex items-center space-x-3.5">
                                    <img src="${skinUrl}" alt="${player.username}" onerror="this.src='https://vzge.me/bust/220/Steve'" class="w-20 h-20 object-contain flex-shrink-0 drop-shadow-lg -my-2">
                                    <span class="font-extrabold text-white text-base group-hover:text-pink-400 transition-colors truncate">${player.username}</span>
                                </div>
                            </div>
                            <div class="w-36 sm:w-40 text-left flex-shrink-0">
                                <span class="font-black text-xl text-pink-400 tracking-wide">${player.points}</span>
                            </div>
                            
                            <div class="flex-1 horizontal-scroll-container py-1">
                                <div class="flex items-center space-x-3 w-max">${badgesHtml}</div>
                            </div>

                            <div class="w-16 text-center flex-shrink-0">
                                <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="event.stopPropagation(); deletePlayer('${player.id}', '${player.username}')" class="text-slate-400 hover:text-rose-400 p-1.5 transition-colors text-sm ml-1" title="Xóa player"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } else {
                overallContent.classList.add('hidden');
                modeColumnsContent.classList.remove('hidden');
                emptyState.classList.add('hidden');

                const tierColsGrid = document.getElementById('tierColumnsGrid');
                const tiersList = ['Tier 1', 'Tier 2', 'Tier 3', 'Tier 4', 'Tier 5'];
                const tierKeys = { 'Tier 1': ['HT1', 'LT1'], 'Tier 2': ['HT2', 'LT2'], 'Tier 3': ['HT3', 'LT3'], 'Tier 4': ['HT4', 'LT4'], 'Tier 5': ['HT5', 'LT5'] };
                const headerColors = {
                    'Tier 1': 'bg-[#92400e]/80 text-amber-300 border-amber-600/50 py-3.5 text-sm',
                    'Tier 2': 'bg-[#475569]/80 text-slate-200 border-slate-500/50 py-3.5 text-sm',
                    'Tier 3': 'bg-[#7c2d12]/80 text-orange-300 border-orange-600/50 py-3.5 text-sm',
                    'Tier 4': 'bg-[#14532d]/80 text-emerald-300 border-emerald-600/50 py-3.5 text-sm',
                    'Tier 5': 'bg-[#334155]/80 text-slate-400 border-slate-600/50 py-3.5 text-sm'
                };

                tierColsGrid.innerHTML = tiersList.map(tierName => {
                    const validKeys = tierKeys[tierName];
                    const matchedPlayers = filtered.filter(p => p.tiers && p.tiers[activeTab] && validKeys.includes(p.tiers[activeTab]));

                    const playerRowsHtml = matchedPlayers.length > 0 ? matchedPlayers.map(p => {
                        const skinUrl = `https://vzge.me/bust/120/${p.username}`;
                        return `
                            <div class="player-row flex items-center px-4 py-3.5 bg-slate-900/60 rounded-xl mb-3" onclick="openPlayerModal('${p.username}')">
                                <div class="flex items-center space-x-3.5 overflow-hidden w-full">
                                    <img src="${skinUrl}" class="w-12 h-12 object-contain flex-shrink-0 drop-shadow" alt="${p.username}">
                                    <span class="font-bold text-white text-sm truncate">${p.username}</span>
                                </div>
                            </div>
                        `;
                    }).join('') : `
                        <div class="py-14 text-center text-slate-500 text-xs italic">
                            Chưa có người chơi
                        </div>
                    `;

                    return `
                        <div class="bg-[#162032] border border-slate-800/80 rounded-2xl overflow-hidden flex flex-col shadow-xl">
                            <div class="font-black text-center border-b ${headerColors[tierName]} uppercase tracking-wider flex items-center justify-center gap-2">
                                <i class="fa-solid fa-trophy text-xs"></i> ${tierName}
                            </div>
                            <div class="p-3.5 flex-1 flex flex-col gap-2 min-h-[240px] justify-start">
                                ${playerRowsHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function openPlayerModal(username) {
            const player = players.find(p => p.username === username);
            if (!player) return;

            let sortedByPoints = [...players].sort((a, b) => b.points - a.points);
            let rankIdx = sortedByPoints.findIndex(p => p.username === username) + 1;

            document.getElementById('modalUsername').innerText = player.username;
            document.getElementById('modalSkinImg').src = `https://vzge.me/bust/220/${player.username}`;
            document.getElementById('modalRankNum').innerText = `#${rankIdx}`;
            document.getElementById('modalPoints').innerText = `(${player.points} points)`;

            const modalTiersContainer = document.getElementById('modalTiersContainer');
            modalTiersContainer.innerHTML = modes.filter(m => m.id !== 'overall').map(mode => {
                const tierVal = player.tiers ? player.tiers[mode.id] : null;
                if (!tierVal) {
                    return `
                        <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/40 border border-slate-800/80 aspect-square w-full opacity-40">
                            <div class="w-8 h-8 rounded-full tier-circle-empty flex items-center justify-center mb-1">
                                <img src="${mode.icon}" class="w-4 h-4 object-contain opacity-50" alt="${mode.name}">
                            </div>
                            <span class="tier-label-empty text-[10px] font-black px-1.5 py-0.5 rounded leading-none">-</span>
                        </div>
                    `;
                }
                const tClass = getTierClass(tierVal);
                return `
                    <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/40 border border-slate-800/80 aspect-square w-full">
                        <div class="w-8 h-8 rounded-full ${tClass.circle} flex items-center justify-center shadow-sm mb-1">
                            <img src="${mode.icon}" class="w-4 h-4 object-contain" alt="${mode.name}">
                        </div>
                        <span class="${tClass.label} text-[10px] font-black px-1.5 py-0.5 rounded leading-none tracking-tight shadow-sm">${tierVal}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('playerModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('playerModal').classList.add('hidden');
        }

        function copyProfileLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Đã sao chép liên kết trang cá nhân!");
        }

        function renderTierlistMaker() {
            const board = document.getElementById('tierlistBoard');
            const pool = document.getElementById('unassignedPool');
            const currentMode = activeTab === 'overall' ? 'Sword' : activeTab;

            board.innerHTML = TIER_RANKS.map(rank => {
                let headerColor = 'bg-slate-800/80 text-pink-300';
                if (rank.endsWith('1') || rank.endsWith('3')) headerColor = 'bg-amber-950/40 text-amber-300';
                else if (rank.endsWith('4')) headerColor = 'bg-green-950/40 text-green-300';
                else if (rank.endsWith('5')) headerColor = 'bg-slate-800/60 text-slate-300';

                return `
                    <div class="tier-row flex rounded-lg overflow-hidden min-h-[75px] bg-slate-900/60 transition-colors"
                         ondragover="allowDrop(event)" ondragleave="clearDragHover(event)" ondrop="handleDrop(event, '${rank}')">
                        <div class="w-28 flex-shrink-0 flex items-center justify-center font-black text-sm ${headerColor}">${rank}</div>
                        <div class="flex-1 p-3 flex flex-wrap gap-2.5 items-center" id="tier_container_${rank}">
                            ${renderTierPlayerCards(currentMode, rank)}
                        </div>
                    </div>
                `;
            }).join('');

            const unassigned = players.filter(p => !p.tiers || !p.tiers[currentMode]);
            pool.innerHTML = unassigned.map(p => createDragCardHtml(p)).join('');
        }

        function renderTierPlayerCards(mode, rank) {
            const assigned = players.filter(p => p.tiers && p.tiers[mode] === rank);
            return assigned.map(p => createDragCardHtml(p)).join('');
        }

        function createDragCardHtml(player) {
            const skinUrl = `https://vzge.me/bust/96/${player.username}`;
            return `
                <div draggable="true" ondragstart="handleDragStart(event, '${player.username}')" 
                     class="drag-item bg-slate-800 hover:border-pink-400 p-1.5 rounded-lg flex items-center space-x-2 cursor-grab active:cursor-grabbing shadow-sm transition-all hover:scale-105">
                    <img src="${skinUrl}" class="w-8 h-8 object-contain">
                    <span class="text-xs font-bold text-slate-200 pr-1">${player.username}</span>
                </div>
            `;
        }

        let draggedUsername = null;
        function handleDragStart(e, username) {
            draggedUsername = username;
            e.dataTransfer.setData('text/plain', username);
        }

        function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function clearDragHover(e) { e.currentTarget.classList.remove('drag-over'); }

        async function handleDrop(e, targetRank) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (!draggedUsername) return;

            const mode = activeTab === 'overall' ? 'Sword' : activeTab;
            const player = players.find(p => p.username === draggedUsername);
            
            if (player) {
                if (!player.tiers) player.tiers = {};
                player.tiers[mode] = targetRank;
                player.points = calculatePlayerPoints(player.tiers);
                
                // Đồng thời cập nhật lên Appwrite Database nếu cần
                try {
                    await databases.updateDocument(
                        DATABASE_ID,
                        COLLECTION_ID,
                        player.id,
                        { tiers: JSON.stringify(player.tiers) }
                    );
                } catch (err) {
                    console.error("Lỗi cập nhật Appwrite:", err);
                }

                renderLeaderboard();
            }
        }

        function setupSearchListener() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                renderLeaderboard();
            });
        }

        async function deletePlayer(docId, username) {
            if (confirm(`Bạn có chắc muốn xóa ${username}?`)) {
                try {
                    await databases.deleteDocument(DATABASE_ID, COLLECTION_ID, docId);
                    players = players.filter(p => p.username !== username);
                    renderLeaderboard();
                } catch (err) {
                    alert("Không thể xóa người chơi: " + err.message);
                }
            }
        }

        function exportTierlistImage() {
            const board = document.getElementById('tierlistBoard');
            html2canvas(board, { backgroundColor: '#0f172a', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `DENNIS_Tierlist_${activeTab.toUpperCase()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
